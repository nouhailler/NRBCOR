<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NRBCOR - Protection Civile & Risques NRBC</title>
    <meta name="description" content="Application citoyenne hors-ligne de protection civile, protocoles réflexes d'urgence et résilience face aux risques technologiques et NRBC." />
    <meta property="og:title" content="NRBCOR - Protection Civile & Risques NRBC" />
    <meta property="og:description" content="Application citoyenne hors-ligne de protection civile, protocoles réflexes d'urgence et résilience face aux risques technologiques et NRBC." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#001126" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Applique le thème avant le premier rendu (évite le flash clair/sombre)
      (function () {
        try {
          var m = localStorage.getItem('nrbcor_theme_mode');
          var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
