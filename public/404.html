<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page introuvable — NRBCOR</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --bg: #f4f7fb; --card: #fff; --ink: #0f1b2d; --muted: #4b5567; --brand: #1d4ed8; --danger: #c62828; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a1220; --card: #111b2c; --ink: #e7edf6; --muted: #a9b4c6; --brand: #3567e8; --danger: #d23c3c; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
      main { background: var(--card); max-width: 28rem; width: 100%; border-radius: 14px; padding: 28px 24px; box-shadow: 0 1px 3px rgb(15 27 45 / .08); }
      img { width: 48px; height: 48px; }
      h1 { font-size: 1.4rem; margin: 14px 0 6px; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 18px; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; }
      a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 12px; font-weight: 600; text-decoration: none; }
      .primary { background: var(--brand); color: #fff; }
      .danger { background: var(--danger); color: #fff; }
      a:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
      small { display: block; margin-top: 18px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>Page introuvable</h1>
      <p>Cette adresse n'existe pas ou a changé. Les consignes d'urgence restent accessibles depuis l'application.</p>
      <div class="actions">
        <a class="primary" href="/">Retour à l'accueil</a>
        <a class="danger" href="/?sub=mode-crise">Ouvrir le mode CRISE</a>
      </div>
      <small lang="en">Page not found. <a href="/" style="min-height:auto;padding:0;color:var(--brand)">Back to NRBCOR</a></small>
    </main>
  </body>
</html>
