<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Shield emblem -->
  <defs>
    <linearGradient id="shieldGrad" x1="10" y1="5" x2="50" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#001126" />
      <stop offset="100%" stop-color="#12263f" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="15" y1="10" x2="45" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#98f6c5" />
      <stop offset="100%" stop-color="#3f9d73" />
    </linearGradient>
  </defs>

  <g transform="translate(4, 2)">
    <!-- Outer Shield -->
    <path d="M26 4 L48 12 C48 34 37 47 26 52 C15 47 4 34 4 12 Z" fill="url(#shieldGrad)" stroke="#3f9d73" stroke-width="1.5" />
    <!-- Inner Trefoil NRBC / Resilience symbol -->
    <circle cx="26" cy="24" r="5" fill="url(#mintGrad)" />
    <path d="M26 12 C29 12 32 15 32 18 C32 20 31 22 29 23 C27 22 25 22 23 23 C21 22 20 20 20 18 C20 15 23 12 26 12 Z" fill="url(#mintGrad)" />
    <path d="M37 31 C35.5 33.6 32.5 34.5 29.8 33.3 C28.2 32.5 27 30.5 27.5 28.5 C29.2 28.7 31 28.1 32.3 27 C33.3 28.5 35 29.5 37 31 Z" fill="url(#mintGrad)" />
    <path d="M15 31 C17 29.5 18.7 28.5 19.7 27 C21 28.1 22.8 28.7 24.5 28.5 C25 30.5 23.8 32.5 22.2 33.3 C19.5 34.5 16.5 33.6 15 31 Z" fill="url(#mintGrad)" />
    <!-- Civil Protection Checkmark -->
    <path d="M20 40 L24 44 L32 35" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Typography -->
  <text x="64" y="32" font-family="'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="800" fill="#001126" letter-spacing="1.5">NRBCOR</text>
  <text x="65" y="47" font-family="'Public Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#3f9d73" letter-spacing="2">PROTECTION CIVILE</text>
</svg>
